name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Compiles dependencies, so it holds no token that can publish.
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches the crate version and is on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build
        run: docker build --pull --platform linux/amd64 -t ciwatch:release .
      - name: Check the image runs as nonroot
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' ciwatch:release)
          case "${user%%:*}" in
            ''|root|0) echo "the image runs as root"; exit 1 ;;
          esac
          docker run --rm --entrypoint /usr/local/bin/ciwatch ciwatch:release --version
      - name: Save
        run: docker save ciwatch:release | gzip > "$RUNNER_TEMP/ciwatch.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/ciwatch.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Runs no code from the repository: loads the built image, pushes, attests.
  publish:
    name: Publish image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c "$RUNNER_TEMP/ciwatch.tar.gz" | docker load
          docker tag ciwatch:release "$IMAGE:$GITHUB_REF_NAME"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      # push-to-registry uses the docker login above.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Log out
        if: always()
        run: docker logout ghcr.io
